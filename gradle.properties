mod_description=An MCP (Model Context Protocol) bridge that lets an AI agent play Minecraft like a real player. On a dedicated server it controls a real online player (movement, mining, building, combat, inventory, crafting, chat, commands). On a physical client it also drives the actual game window: create or load a single-player world from the main menu, click any GUI screen, take screenshots, hold real movement keys and click container slots.
